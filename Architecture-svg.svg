<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="8" />

  <!-- Grid Lines (Subtle) -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- 1. PC Graphical UI Block -->
  <g filter="url(#drop-shadow)">
    <rect x="250" y="40" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <text x="400" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">St Agro Programmer &amp; Dashboard</text>
    <text x="400" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">(PC Graphical UI)</text>
  </g>

  <!-- Connection: PC to Gateway -->
  <line x1="400" y1="120" x2="400" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350" y="143" width="100" height="24" rx="4" fill="#E2E8F0" />
  <text x="400" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">USB / COM</text>

  <!-- 2. Master / Gateway Node Block -->
  <g filter="url(#drop-shadow)">
    <rect x="250" y="190" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" />
    <text x="400" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Master / Gateway Node</text>
    <text x="400" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">(Slot A)</text>
  </g>

  <!-- Connection: Gateway to Bus -->
  <line x1="400" y1="270" x2="400" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="4" />
  <rect x="315" y="288" width="170" height="24" rx="4" fill="#E2E8F0" />
  <text x="400" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Wireless Communication</text>

  <!-- Horizontal Distribution Bus -->
  <line x1="140" y1="330" x2="660" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- Vertical Connections to Sender Nodes -->
  <line x1="140" y1="330" x2="140" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="330" x2="400" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="660" y1="330" x2="660" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Sender Node 1 -->
  <g filter="url(#drop-shadow)">
    <rect x="50" y="370" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" />
    <text x="140" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Sender Node 1</text>
    <text x="140" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Sensors &amp; Relays</text>
  </g>

  <!-- 4. Sender Node 2 -->
  <g filter="url(#drop-shadow)">
    <rect x="310" y="370" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" />
    <text x="400" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Sender Node 2</text>
    <text x="400" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Sensors &amp; Relays</text>
  </g>

  <!-- 5. Sender Node N -->
  <g filter="url(#drop-shadow)">
    <rect x="570" y="370" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" />
    <text x="660" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Sender Node N</text>
    <text x="660" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Sensors &amp; Relays</text>
  </g>
</svg>
